name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, device SDK)
        run: |
          set -o pipefail
          xcodebuild \
            -project BlueryaiArchive.xcodeproj \
            -scheme BlueryaiArchive \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BlueryaiArchive.app Payload/
          zip -qr BlueryaiArchive-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BlueryaiArchive-unsigned-ipa
          path: BlueryaiArchive-unsigned.ipa
